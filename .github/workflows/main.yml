name: Build and Publish Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi

      - name: Build debug APK
        run: >
          gradle :app:assembleDebug --stacktrace --no-daemon
          --no-configuration-cache --no-parallel
          -Pkotlin.compiler.execution.strategy=daemon
          -Pkotlin.daemon.jvmargs=-Xmx3g

      - name: Verify APK
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk zentrix-store-debug-${{ github.run_number }}.apk
          gh release create "debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}" \
            "zentrix-store-debug-${{ github.run_number }}.apk" \
            --title "Debug APK Build #${{ github.run_number }}" \
            --target "${{ github.sha }}" --latest
